services:
  postgres:
    image: postgres:17
    container_name: forgewatch-postgres
    environment:
      POSTGRES_DB: forgewatch
      POSTGRES_USER: forgewatch
      POSTGRES_PASSWORD: forgewatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forgewatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgewatch -d forgewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/forgewatch-backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgewatch
      SPRING_DATASOURCE_USERNAME: forgewatch
      SPRING_DATASOURCE_PASSWORD: forgewatch
    ports:
      - "127.0.0.1:8080:8080"

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    profiles:
      - simulator
    depends_on:
      backend:
        condition: service_started
    environment:
      FORGEWATCH_BACKEND_URL: http://backend:8080
      FORGEWATCH_SENSOR_ID: ${FORGEWATCH_SENSOR_ID:-1}
      FORGEWATCH_INTERVAL: ${FORGEWATCH_INTERVAL:-5s}
      FORGEWATCH_MIN_VALUE: ${FORGEWATCH_MIN_VALUE:-20}
      FORGEWATCH_MAX_VALUE: ${FORGEWATCH_MAX_VALUE:-30}
      FORGEWATCH_MODE: ${FORGEWATCH_MODE:-continuous}
    restart: "no"

volumes:
  forgewatch-data: